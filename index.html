<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yellowstone — 1870s</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #0a0704;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }

    #scene {
      position: relative;
      width: 100vw;
      overflow: hidden;
      flex-shrink: 0;
    }

    #bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none; user-select: none;
    }

    .animal {
      position: absolute; width: auto;
      pointer-events: none; user-select: none;
    }

    .tree-layer {
      position: absolute; width: auto;
      pointer-events: none; user-select: none;
      transition: opacity 0.3s ease;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0px);  }
      50%       { transform: translateY(-4px); }
    }

    /* ── Screen 1 narration ─────────────────────────────────────────────── */
    #narration {
      position: absolute;
      top: 110px;
      left: 0; right: 0;
      text-align: center;
      pointer-events: none;
      z-index: 100;
    }

    .n-line {
      display: block;
      width: fit-content;
      margin: 0 auto 10px;
      background: rgba(0, 0, 0, 0.80);
      padding: 8px 28px;
      border-radius: 5px;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(255, 255, 255, 0.5);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #line1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic; font-weight: normal;
      font-size: 52px;
      margin-bottom: 10px;
    }

    #line2 {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: normal; font-weight: 300;
      font-size: 22px; letter-spacing: 0.05em;
    }

    /* ── Continue button ─────────────────────────────────────────────────── */
    .continue-btn {
      position: absolute;
      top: 120px; right: 44px;
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic; font-size: 22px;
      color: #000000;
      background: none; border: none;
      padding: 8px 4px;
      cursor: pointer;
      opacity: 0; transition: opacity 0.3s ease;
      pointer-events: none;
      text-shadow: 0 1px 4px rgba(255, 255, 255, 0.6);
      letter-spacing: 0.04em;
      z-index: 200;
    }
    .continue-btn.show  { opacity: 1; pointer-events: auto; }
    .continue-btn:hover { opacity: 0.72; }

    /* ── Black transition overlay ────────────────────────────────────────── */
    #fade-overlay {
      position: fixed; inset: 0;
      background: transparent; opacity: 0;
      pointer-events: none;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }

   

    /* ── Human figures ───────────────────────────────────────────────────── */
    .human {
      position: absolute; width: auto;
      pointer-events: none; user-select: none;
      opacity: 0; transition: opacity 0.3s ease;
    }
    .human.visible { opacity: 1; }

    /* ── Shared narration container for Screens 2–5 ──────────────────────── */
    .sN-narration {
      position: absolute;
      top: 110px;
      left: 0; right: 0;
      height: 0;          /* anchor only; lines overflow visibly */
      pointer-events: none;
      z-index: 100;
    }

    .sN-line {
      position: absolute;
      top: 0;
      left: 50%; transform: translateX(-50%);
      width: max-content; max-width: 78vw;
      text-align: center;
      background: rgba(0, 0, 0, 0.80);
      padding: 8px 28px;
      border-radius: 5px;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(255, 255, 255, 0.5);
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      opacity: 0; transition: opacity 0.3s ease;
    }

    #s2-line1 { font-size: 28px; font-weight: normal; }
    #s2-line2 { font-size: 36px; font-weight: normal; }
    #s2-line3 { font-size: 28px; font-weight: normal; }
    #s3-line1 { font-size: 28px; font-weight: normal; }
    #s3-line2 { font-size: 28px; font-weight: normal; }
    #s4-line1 { font-size: 26px; font-weight: normal; }
    #s4-line2 { font-size: 26px; font-weight: normal; }
    #s4-line3 { font-size: 26px; font-weight: normal; }
    #s5-line1 { font-size: 28px; font-weight: normal; }
    #s5-line2 { font-size: 28px; font-weight: normal; }
    #s5-line3 { font-size: 28px; font-weight: normal; }
    #s6-line1 { font-size: 28px; font-weight: normal; }
    #s6-line2 { font-size: 44px; font-weight: normal; }
    #s6-line3 { font-size: 28px; font-weight: normal; }



    /* ── Screen 5+: Full-meadow drying overlay ──────────────────────────── */
    #dry-overlay {
      position: absolute; left: 0; right: 0;
      pointer-events: none; z-index: 8;
      background: rgba(160, 120, 45, 0.28);
      opacity: 0; transition: opacity 2.5s ease;
    }

    /* ── Shared: top dark narration box (Screen 6 picker + Screen 7) ───── */
    .top-dark-box {
      position: absolute;
      top: 110px;
      left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.80);
      padding: 16px 28px;
      border-radius: 8px;
      text-align: center;
      z-index: 9999;
      min-width: 320px;
      max-width: 82vw;
    }

    /* ── Screen 6: Wolf picker ───────────────────────────────────────────── */
    #wolf-picker {
      pointer-events: auto;
      opacity: 0; transition: opacity 0.7s ease;
    }
    .wp-line3 {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic; font-size: 26px;
      color: #ffffff;
      display: block; margin-bottom: 14px;
    }
    .wp-row {
      display: flex; align-items: center; justify-content: center;
      gap: 14px; margin-bottom: 8px;
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic; font-size: 19px;
      color: #ffffff;
    }
    #wolf-slider {
      width: 200px;
      accent-color: #f5d060;
      cursor: pointer;
    }
    #wolf-count {
      font-size: 22px; font-weight: bold;
      min-width: 26px; color: #f5d060;
    }
    .wp-note {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic; font-size: 13px;
      color: rgba(255,255,255,0.60);
      margin-bottom: 10px;
    }
    #release-btn {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic; font-size: 19px;
      color: #ffffff;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.80);
      padding: 7px 24px; border-radius: 5px;
      cursor: pointer; transition: background 0.2s;
    }
    #release-btn:hover { background: rgba(255,255,255,0.12); }

    /* ── Screen 7: narration text ────────────────────────────────────────── */
    #s7-narration { pointer-events: none; }
    #s7-text {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic; font-size: 26px;
      color: #ffffff;
      opacity: 0; transition: opacity 0.3s ease;
      margin: 0; display: block;
    }

    /* ── Screen 8: Sandbox slider bar ──────────────────────────────────────────── */
    #s8-slider-bar {
      position: absolute;
      top: 182px; left: 50%; transform: translateX(-50%);
      width: max-content;
      background: rgba(0,0,0,0.80);
      padding: 10px 28px;
      border-radius: 8px;
      display: flex; align-items: flex-start; justify-content: center;
      gap: 40px;
      z-index: 1001;
      font-family: Georgia, serif; color: #fff; font-size: 13px;
      white-space: nowrap;
    }
    .s8-slider-group { text-align: center; }
    .s8-slider-group label { display: block; font-style: italic; margin-bottom: 4px; font-size: 13px; }
    .s8-slider-group .s8-val { font-size: 18px; font-weight: bold; color: #f5d060; display: block; margin-top: 2px; }
    .s8-slider-group .s8-sub { font-size: 11px; opacity: 0.65; font-style: italic; margin-top: 2px; }
    .s8-slider-group input[type=range] { width: 180px; accent-color: #f5d060; }

    /* ── Screen 8: Dashboard ─────────────────────────────────────────────────── */
    #s8-dashboard {
      position: absolute;
      background: rgba(0,0,0,0.60);
      border-radius: 8px; padding: 12px;
      z-index: 1002; color: #fff;
      font-family: Georgia, serif; font-size: 12px;
      min-width: 140px;
    }
    .db-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 10px; }
    .db-label { font-style: italic; opacity: 0.8; }
    .db-val { font-size: 16px; font-weight: bold; }
    .db-arrow { font-size: 13px; }
    .db-up { color: #6ef06e; }
    .db-dn { color: #f06e6e; }

    /* ── Animal tooltip ──────────────────────────────────────────────────────── */
    .eco-tooltip {
      position: absolute;
      background: rgba(0,0,0,0.80);
      color: #fff; border-radius: 6px;
      padding: 8px 14px; font-family: Georgia, serif;
      font-style: italic; font-size: 13px;
      max-width: 220px; text-align: center;
      pointer-events: none; z-index: 1003;
      border: 1px solid rgba(255,255,255,0.25);
    }

  /* ── Screen 9: Interactive Trophic Cascade Map ──────────────────────────── */
  #s9-screen {
    position: fixed; inset: 0; z-index: 8000;
    background: #0d1610;
    display: flex; flex-direction: column;
    font-family: Georgia, serif; color: #e8ffe8;
    overflow: hidden;
  }
  #s9-title-bar {
    display: flex; align-items: baseline; padding: 10px 20px 8px;
    background: rgba(0,0,0,0.45); border-bottom: 1px solid rgba(255,255,255,0.1);
    gap: 14px;
  }
  #s9-title-bar h1 { font-size: 20px; font-style: italic; margin: 0; }
  #s9-title-bar span { font-size: 12px; opacity: 0.45; font-style: normal; }
  #s9-body { flex: 1; display: flex; overflow: hidden; min-height: 0; }
  #s9-map { flex: 1; position: relative; overflow: hidden; cursor: default; }
  #s9-map-svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .s9-node {
    position: absolute; transform: translate(-50%,-50%);
    background: #192a1b; border: 1.5px solid rgba(255,255,255,0.22);
    border-radius: 10px; padding: 7px 12px;
    font-size: 11.5px; text-align: center; line-height: 1.35;
    cursor: pointer; white-space: pre-line;
    transition: background 0.2s, border-color 0.2s, box-shadow 0.2s, opacity 0.2s;
    user-select: none; z-index: 2;
  }
  .s9-node:hover { border-color: rgba(255,255,255,0.7); }
  .s9-node.s9-active {
    background: #2a5030; border-color: #8fff8f;
    box-shadow: 0 0 14px rgba(100,255,100,0.4); z-index: 3;
  }
  .s9-node.s9-connected { border-color: rgba(120,255,120,0.55); }
  .s9-node.s9-dimmed { opacity: 0.12; }
  .s9-node.s9-healthy { border-color: #6ef06e !important; }
  .s9-node.s9-stressed { border-color: #f06e6e !important; background: #2a1919 !important; }
  #s9-panel {
    width: 220px; background: rgba(0,0,0,0.4);
    border-left: 1px solid rgba(255,255,255,0.1);
    padding: 18px 16px; font-size: 13px; line-height: 1.6;
    display: flex; flex-direction: column; gap: 8px; overflow-y: auto;
  }
  #s9-pname { font-size: 16px; color: #a8ffa8; margin: 0 0 4px; }
  #s9-pdesc { opacity: 0.8; margin: 0; font-style: italic; font-size: 12px; }
  #s9-pconn { font-size: 10.5px; opacity: 0.5; white-space: pre-line; margin-top: 4px; }
  #s9-bottom {
    padding: 10px 24px 12px;
    background: rgba(0,0,0,0.5); border-top: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; gap: 32px; flex-wrap: wrap; justify-content: center;
  }
  .s9-sl-group { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
  .s9-sl-group label { display: flex; justify-content: space-between; gap: 12px; }
  .s9-sl-group input[type=range] { width: 190px; accent-color: #6ef06e; }
  .s9-sl-sub { font-size: 10px; opacity: 0.4; }
  #s9-legend { display: flex; gap: 14px; font-size: 11px; opacity: 0.65; align-items: center; }
  .s9-leg { display: flex; align-items: center; gap: 5px; }
  .s9-leg-line { width: 22px; height: 2px; }
  .s9-leg-line.pos { background: #6ef06e; }
  .s9-leg-line.neg { background: #f06e6e; }
  .s9-leg-line.neu { background: rgba(255,255,255,0.4); }
  #s9-close-btn {
    font-family: Georgia, serif; font-style: italic; font-size: 15px;
    color: #fff; background: transparent; border: 1px solid rgba(255,255,255,0.35);
    padding: 6px 18px; border-radius: 5px; cursor: pointer; margin-left: auto;
  }
  #s9-close-btn:hover { background: rgba(255,255,255,0.1); }
  </style>
  <script src="ecosystem.js"></script>
  <script src="trees.js"></script>
</head>
<body>

<audio id="bgMusic" src="audio/music.mp3" loop></audio>

<div id="fade-overlay"></div>

<div id="scene">
  <img id="bg" src="images/background.png?v=2" alt="">

  <div id="narration">
    <span id="line1" class="n-line">Yellowstone. 1870s.</span>
    <span id="line2" class="n-line">The most biodiverse valley in North America.</span>
  </div>

  <button id="continue-btn" class="continue-btn">→ Continue</button>
</div>

<script>
  // ── allTrees — reset each screen, populated from trees.js TREE_DATA ──────────
  let allTrees = [];
  let _pendingTimers = [];
  let _onSceneClick = null;
  function clearTimers() { _pendingTimers.forEach(t => clearTimeout(t)); _pendingTimers = []; }
  function wait(fn, delay) { const t = setTimeout(fn, delay); _pendingTimers.push(t); return t; }
  document.addEventListener('click', (e) => {
    if (e.target.closest('button') || e.target.closest('input')) return;
    if (_onSceneClick) { const fn = _onSceneClick; _onSceneClick = null; clearTimers(); fn(); }
  });

  // ── Animal / human data ───────────────────────────────────────────────────────
  // All positions read from ecosystem.js — edit there to reposition
  const wolves    = ECOSYSTEM.wolves.slice(0, 5);   // S1 uses first 5
  const elk       = ECOSYSTEM.elk.slice(0, 8);       // S1 uses first 8
  const newElkDefs = ECOSYSTEM.elk.slice(8);         // S4+ expanded herd (20 more)
  const coyoteDefs = ECOSYSTEM.coyotes;
  const humanDefs = [
    { src:'images/human-horse.png',   id:'h-horse', xPct: ECOSYSTEM.humans.horse.x,   yPct: ECOSYSTEM.humans.horse.y,   hf: ECOSYSTEM.humans.horse.h   },
    { src:'images/human-gun.png',     id:'h-gun',   xPct: ECOSYSTEM.humans.gun.x,     yPct: ECOSYSTEM.humans.gun.y,     hf: ECOSYSTEM.humans.gun.h     },
    { src:'images/human-talking.png', id:'h-talk',  xPct: ECOSYSTEM.humans.talking.x, yPct: ECOSYSTEM.humans.talking.y, hf: ECOSYSTEM.humans.talking.h },
  ];
  const s7WolfPositions = ECOSYSTEM.wolves; // all 14 for S7 slide-in
  const patchDefs = [
    { x: 04, y: 50, hf: 0.06 },
    { x: 14, y: 56, hf: 0.12 },
    { x: 90, y: 50, hf: 0.09 },
    { x: 34, y: 74, hf: 0.11 },
    { x: 44, y: 68, hf: 0.10 },
    { x: 14, y: 84, hf: 0.09 },
  ];


  // ── DOM refs ──────────────────────────────────────────────────────────────────
  const scene       = document.getElementById('scene');
  const narration   = document.getElementById('narration');
  const line1       = document.getElementById('line1');
  const line2       = document.getElementById('line2');
  const continueBtn = document.getElementById('continue-btn');
  const fadeOverlay = document.getElementById('fade-overlay');

  let activeLayout = null;

  // ── Tree helpers ──────────────────────────────────────────────────────────────
  function addTrees(anchor) {
    allTrees = [];
    TREE_DATA.forEach(d => {
      const el = document.createElement('img');
      el.src = d.type === 'pine' ? 'images/tree.png' : 'images/tree2.png';
      el.alt = '';
      el.classList.add('tree-layer');
      el.dataset.xPct = d.x;
      el.dataset.yPct = d.y;
      el.dataset.hf   = d.h;
      anchor ? scene.insertBefore(el, anchor) : scene.appendChild(el);
      allTrees.push({ type: d.type, el });
    });
  }

  function layoutTrees(w, h) {
    allTrees.forEach(({ el }) => {
      const xPct = parseFloat(el.dataset.xPct);
      const yPct = parseFloat(el.dataset.yPct);
      const hf   = parseFloat(el.dataset.hf);
      el.style.height = `${Math.round(h * hf)}px`;
      el.style.width  = 'auto';
      el.style.left   = `${Math.round(w * xPct / 100)}px`;
      el.style.top    = `${Math.round(h * yPct / 100)}px`;
      // Trees render 1 z-unit behind animals at same y
      el.style.zIndex = String(Math.round(yPct * 10) - 1);
    });
  }

  // ── Animal helpers ────────────────────────────────────────────────────────────
  function buildAnimal(src, data, baseHF, globalIndex, insertBefore) {
    const img = document.createElement('img');
    img.src = src; img.alt = '';
    img.classList.add('animal');
    const duration = (2.0 + Math.random() * 1.0).toFixed(2);
    const delay    = (globalIndex * 0.28).toFixed(2);
    img.style.animationName           = 'bob';
    img.style.animationDuration       = `${duration}s`;
    img.style.animationDelay          = `${delay}s`;
    img.style.animationTimingFunction = 'ease-in-out';
    img.style.animationIterationCount = 'infinite';
    img.dataset.xPct             = data.x;
    img.dataset.yPct             = data.y;
    img.dataset.scale            = data.scale !== undefined ? data.scale : 1.0;
    img.dataset.baseHeightFactor = baseHF !== undefined ? baseHF : (data.h || 0.10);
    insertBefore ? scene.insertBefore(img, insertBefore) : scene.appendChild(img);
    return img;
  }

  function layoutAnimals(animals, w, h) {
    animals.forEach(img => {
      const xPct  = parseFloat(img.dataset.xPct);
      const yPct  = parseFloat(img.dataset.yPct);
      const scale = parseFloat(img.dataset.scale);
      const baseH = parseFloat(img.dataset.baseHeightFactor);
      img.style.height = `${Math.round(h * baseH * scale)}px`;
      img.style.width  = 'auto';
      img.style.left   = `${Math.round(w * xPct / 100)}px`;
      img.style.top    = `${Math.round(h * yPct / 100)}px`;
      img.style.zIndex = String(Math.round(yPct * 10));
    });
  }

  // ── Transition helper ─────────────────────────────────────────────────────────
  function doTransition(buildFn) {
    fadeOverlay.style.transition = 'opacity 0.2s ease';
    fadeOverlay.style.opacity = '0';
    fadeOverlay.style.pointerEvents = 'auto';
    setTimeout(() => {
      if (activeLayout) window.removeEventListener('resize', activeLayout);
      buildFn();
      requestAnimationFrame(() => requestAnimationFrame(() => {
        fadeOverlay.style.transition = 'opacity 0.2s ease';
        fadeOverlay.style.opacity = '0';
        setTimeout(() => { fadeOverlay.style.pointerEvents = 'none'; }, 500);
      }));
    }, 300);
  }

  // ── buildBaseScene — shared scaffold for Screens 2–5 ─────────────────────────
  function buildBaseScene(narId, humanVisible) {
    scene.innerHTML = '';

    const bg = document.createElement('img');
    bg.id = 'bg'; bg.src = 'images/background.png?v=2'; bg.alt = '';
    scene.appendChild(bg);

    const skyOv = document.createElement('div');
    skyOv.id = 'sky-overlay';
    scene.appendChild(skyOv);

    // Narration anchor — trees and animals insert before this
    const narDiv = document.createElement('div');
    narDiv.id = narId;
    narDiv.className = 'sN-narration';
    scene.appendChild(narDiv);

    // Trees before animals (z-index handles layering)
    addTrees(narDiv);

    const elkEls = elk.map((d, i) =>
      buildAnimal('images/elk.png', d, 0.10, wolves.length + i, narDiv)
    );

    const humanEls = humanDefs.map((d, i) => {
      const img = document.createElement('img');
      img.src = d.src; img.alt = ''; img.id = d.id;
      img.classList.add('human');
      img.dataset.xPct = d.xPct; img.dataset.yPct = d.yPct; img.dataset.hf = d.hf;
      const dur = (2.0 + Math.random() * 1.0).toFixed(2);
      img.style.animationName           = 'bob';
      img.style.animationDuration       = `${dur}s`;
      img.style.animationDelay          = `${(i * 0.4).toFixed(2)}s`;
      img.style.animationTimingFunction = 'ease-in-out';
      img.style.animationIterationCount = 'infinite';
      if (humanVisible) img.classList.add('visible');
      scene.insertBefore(img, narDiv);
      return img;
    });

    return { skyOv, narDiv, elkEls, humanEls };
  }

  function layoutHumans(humanEls) {
    const w = window.innerWidth;
    const h = Math.round(w * 9 / 16);
    humanEls.forEach(img => {
      img.style.height = `${Math.round(h * parseFloat(img.dataset.hf))}px`;
      img.style.width  = 'auto';
      img.style.left   = `${Math.round(w * parseFloat(img.dataset.xPct) / 100)}px`;
      img.style.top    = `${Math.round(h * parseFloat(img.dataset.yPct) / 100)}px`;
      img.style.zIndex = String(Math.round(parseFloat(img.dataset.yPct) * 10));
    });
  }

  // ── Screen 1 ──────────────────────────────────────────────────────────────────
  addTrees(narration);

  const wolfEls = wolves.map((d, i) =>
    buildAnimal('images/wolf.png', d, 0.085, i, narration)
  );
  const elkEls = elk.map((d, i) =>
    buildAnimal('images/elk.png', d, 0.10, wolves.length + i, narration)
  );
  const s1Animals = [...wolfEls, ...elkEls];

  function s1Layout() {
    const w = window.innerWidth;
    const h = Math.round(w * 9 / 16);
    scene.style.height = `${h}px`;
    layoutTrees(w, h);
    layoutAnimals(s1Animals, w, h);
  }
  activeLayout = s1Layout;
  window.addEventListener('resize', s1Layout);
  s1Layout();

  const music = document.getElementById('bgMusic'); music.volume = 0.25; music.play().catch(()=>{ document.addEventListener('click', ()=>music.play(), {once:true}); });

  setTimeout(() => { line1.style.opacity = '1'; }, 100);           // S1 — Line 1 "Yellowstone. 1870s." fades in

  // ── Shared helper: bare soil patch images (Screens 5 & 6) ───────────────────
  function buildPatches(anchor, startVisible) {
    return patchDefs.map(p => {
      const img = document.createElement('img');
      img.src = 'images/patch.png'; img.alt = '';
      img.style.position  = 'absolute';
      img.style.width     = 'auto';
      img.style.pointerEvents = 'none';
      img.style.userSelect    = 'none';
      img.style.opacity       = startVisible ? '1' : '0';
      img.style.transition    = 'opacity 0.2s ease';
      img.dataset.xPct = p.x; img.dataset.yPct = p.y; img.dataset.hf = p.hf;
      img.style.zIndex = '9';
      scene.insertBefore(img, anchor);
      return img;
    });
  }

  function layoutPatches(patchEls, w, h) {
    patchEls.forEach(img => {
      const ph = Math.round(h * parseFloat(img.dataset.hf));
      img.style.height = `${ph}px`;
      img.style.left   = `${Math.round(w * parseFloat(img.dataset.xPct) / 100)}px`;
      img.style.top    = `${Math.round(h * parseFloat(img.dataset.yPct) / 100)}px`;
    });
  }

    setTimeout(() => {

  // ── Screen 7 ──────────────────────────────────────────────────────────────────
  function buildScreen7(wolvesChosen) {
    scene.innerHTML = '';

    const bg = document.createElement('img');
    bg.id = 'bg'; bg.src = 'images/background.png?v=2'; bg.alt = '';
    scene.appendChild(bg);

    const skyOv = document.createElement('div');
    skyOv.id = 'sky-overlay'; skyOv.style.opacity = '1';
    scene.appendChild(skyOv);

    const narBox = document.createElement('div');
    narBox.id = 's7-narration'; narBox.className = 'top-dark-box';
    narBox.innerHTML = '<p id="s7-text"></p>';
    scene.appendChild(narBox);

    // Muddy ground — visible (from S5/S6)
    const muddyOv = document.createElement('div');
    muddyOv.id = 'muddy-ov';
    muddyOv.style.cssText = `position:absolute;left:0;right:0;pointer-events:none;z-index:8;
      background:${ECOSYSTEM.muddyPatch.color};opacity:1;transition:opacity 3.5s ease;`;
    scene.appendChild(muddyOv);

    // Trees — start invisible
    addTrees(narBox);
    allTrees.forEach(({el}) => { el.style.opacity='0'; el.style.transition='opacity 1.0s ease'; });

    // 28 elk
    const s7InitialElk = elk.map((d,i) => buildAnimal('images/elk.png', d, d.h||0.10, i, narBox));
    const s7ExtraElk   = newElkDefs.map((d,i) => {
      const img = buildAnimal('images/elk.png', d, d.h||0.10, elk.length+i, narBox);
      img.style.opacity = '1'; return img;
    });
    const s7ElkEls = [...s7InitialElk, ...s7ExtraElk];

    // 3 coyotes
    const s7Coyotes = coyoteDefs.map((d,i) => {
      const img = buildAnimal('images/coyote.png', d, d.h||0.07, 100+i, narBox);
      img.style.transform='scaleX(-1)'; img.style.opacity='1'; return img;
    });

    // Patches
    const patchEls = buildPatches(narBox, true);

    // Wolves (built invisible, slide in from left on paths B-E)
    const wolvesToShow = Math.min(wolvesChosen, s7WolfPositions.length);
    const s7WolfEls = [];
    for (let i=0; i<wolvesToShow; i++) {
      const d = s7WolfPositions[i];
      const img = buildAnimal('images/wolf.png', d, d.h||0.085, i, narBox);
      img.style.opacity='0'; s7WolfEls.push(img);
    }

    // Outcome button
    const s7Btn = document.createElement('button');
    s7Btn.className='continue-btn'; s7Btn.textContent='→ See the outcome';
    scene.appendChild(s7Btn);
    s7Btn.addEventListener('click', () => buildScreen8());

    // Narration helper
    function showText(text, size) {
      const el = document.getElementById('s7-text');
      if (!el) return;
      el.style.transition='opacity 0.2s ease'; el.style.opacity='0';
      setTimeout(() => {
        el.textContent=text; el.style.fontSize=size||'26px';
        el.style.transition='opacity 1.0s ease'; el.style.opacity='1';
      }, 700);
    }

    // Layout
    let wolvesArrived = false;
    const s7AllForLayout = [...s7ElkEls, ...s7Coyotes, ...s7WolfEls];
    function s7Layout() {
      const w=window.innerWidth, h=Math.round(w*9/16);
      scene.style.height=`${h}px`;
      muddyOv.style.top=ECOSYSTEM.muddyPatch.top;
      muddyOv.style.height=ECOSYSTEM.muddyPatch.height;
      layoutTrees(w,h); layoutAnimals(s7AllForLayout,w,h); layoutPatches(patchEls,w,h);
      if (!wolvesArrived) {
        s7WolfEls.forEach(img => {
          img.dataset.targetLeft=img.style.left;
          img.style.transition='none';
          img.style.left=`${-Math.round(w*0.08)}px`;
        });
      }
    }
    activeLayout=s7Layout;
    window.addEventListener('resize', s7Layout);
    s7Layout();

    // Wolf slide-in helper
    function slideWolvesIn(count) {
      const toShow = s7WolfEls.slice(0, count);
      toShow.forEach((img,i) => {
        setTimeout(() => {
          img.style.transition='left 2.0s ease, opacity 1.0s ease';
          img.style.left=img.dataset.targetLeft;
          img.style.opacity='1';
        }, 200 + i*250);
      });
      const doneAt = 200 + Math.max(0,count-1)*250 + 2000;
      setTimeout(() => { wolvesArrived=true; }, doneAt);
      return doneAt;
    }

    // Scientist's choice badge helper
    function showScientistBadge() {
      const badge = document.createElement('div');

    // ── PATH A: 0 wolves ──────────────────────────────────────────────────────

    // ── PATH C: 7–13 wolves ───────────────────────────────────────────────────

      // Beavers

    // ── PATH D: 14–17 wolves — full cascade ───────────────────────────────────
    if (wolvesChosen>=14 && wolvesChosen<=17) {

      setTimeout(()=>{

      setTimeout(()=>{

        groups.forEach((grp,g)=>setTimeout(()=>{ grp.forEach(({el})=>{ el.style.opacity='1'; }); },g*750));         // S7D — Pine tree group regrows (staggered wave)
        setTimeout(()=>{ allGrass.forEach(({el})=>{ el.style.opacity='1'; }); },groups.length*750);                 // S7D — Grassland trees regrow (after all pine groups)
        // Patches fade as forests return
        patchEls.forEach((img,i)=>{ setTimeout(()=>{ img.style.transition='opacity 2.5s ease'; img.style.opacity='0'; }, i*300); });  // S7D — Bare soil patch fades (forests reclaiming ground)
      },step4At);                                                                                          // S7D — Forest regrowth sequence starts

      // Species cascade sequence
      const speciesSeq = [
        { key:'beaver',    src:'images/beaver.png',    line:'Beavers returned — for the first time in decades.',    delay:0 },
        { key:'beaverDam', src:'images/beaver-dam.png', line:'They built dams, slowing the river and filtering the water.', delay:2250 },
        { key:'grizzly',   src:'images/grizzly.png',   line:'Grizzly bears thrived, feeding on wolf kills.',         delay:4500 },
        { key:'songbird',  src:'images/songbird.png',  line:'Songbirds returned as riverside forests grew back.',    delay:6750 },
        { key:'otter',     src:'images/otter.png',     line:'Otters came back as the river ran clear again.',        delay:9000 },
        { key:'eagle',     src:'images/eagle.png',     line:'Eagles and hawks returned — fewer coyotes meant more prey.', delay:11250 },
        { key:'pronghorn', src:'images/pronghorn.png', line:'Pronghorn antelope recovered as coyote numbers fell.', delay:13500 },
      ];
      const speciesStartAt=step4At+9000;
      speciesSeq.forEach(({key,src,line,delay})=>{
        setTimeout(()=>{
          showText(line,'24px');                                                                           // S7D — Species cascade narration + animal image appears

          spImg.onerror=()=>{spImg.style.display='none';};

          spImg.style.left=`${Math.round(sw*def.x/100)}px`;
          spImg.style.top=`${Math.round(sh*def.y/100)}px`;
          spImg.style.zIndex=String(def.z);
          spImg.style.animationName='bob';
          spImg.style.animationDuration=`${(2.0+Math.random()*1.0).toFixed(2)}s`;
          spImg.style.animationDelay=`${(Math.random()*1.5).toFixed(2)}s`;
          spImg.style.animationTimingFunction='ease-in-out';
          spImg.style.animationIterationCount='infinite';
          scene.insertBefore(spImg,s7Btn);
          requestAnimationFrame(()=>requestAnimationFrame(()=>{ spImg.style.opacity='1'; }));
        },speciesStartAt+delay);
      });

      const finalAt=speciesStartAt+15750;
      setTimeout(()=>{ showText('This is a trophic cascade. One species changed everything.','34px'); },finalAt);  // S7D — Final narration: trophic cascade reveal
      setTimeout(()=>{ s7Btn.classList.add('show'); },finalAt+2250);                                               // S7D — Continue button appears
      return;
    }

    // ── PATH E: 18+ wolves — too many ─────────────────────────────────────────
    setTimeout(()=>{ showText(`${wolvesChosen} wolves — far more than the ecosystem had seen in a century.`,'26px'); },3500);  // S7E — Narration: too many wolves
    const arrivedEAt=slideWolvesIn(14)+3500; // cap visual at 14
    setTimeout(()=>{ showText('The elk were over-hunted. Their population collapsed too quickly.','26px'); },arrivedEAt+4000);  // S7E — Narration: elk over-hunted, collapse
    setTimeout(()=>{
      s7ElkEls.forEach((img,i)=>{
        setTimeout(()=>{ img.style.transition='opacity 0.2s ease'; img.style.opacity='0'; },i*180);   // S7E — Elk fades out rapidly (population collapse)
      });
    },arrivedEAt+4500);                                                                                 // S7E — All elk fade out (herd collapse sequence starts)
    // Grizzly

      showText('Without enough elk grazing, grizzlies competed fiercely for wolf kills.','26px');      // S7E — Narration: grizzly competition
      const def=ECOSYSTEM.grizzly;
      const gz=document.createElement('img');
      gz.src='images/grizzly.png'; gz.alt=''; gz.classList.add('animal');
      gz.onerror=()=>{gz.style.display='none';};
      gz.style.opacity='0'; gz.style.transition='opacity 1.0s ease';
      const gw=window.innerWidth,gh=Math.round(gw*9/16);
      gz.style.height=`${Math.round(gh*def.h)}px`; gz.style.width='auto';
      gz.style.left=`${Math.round(gw*def.x/100)}px`;
      gz.style.top=`${Math.round(gh*def.y/100)}px`;
      gz.style.zIndex=String(def.z);

      gz.style.animationTimingFunction='ease-in-out'; gz.style.animationIterationCount='infinite';
      scene.insertBefore(gz,s7Btn);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ gz.style.opacity='1'; }));                 // S7E — Grizzly image appears
      // Grizzly moves toward wolves
      setTimeout(()=>{
        gz.style.transition='left 2.5s ease';
        gz.style.left=`${Math.round(gw*0.08)}px`;
      },1500);                                                                                          // S7E — Grizzly moves toward wolves (aggression)
    },arrivedEAt+8000);                                                                               // S7E — Grizzly appears + narration: grizzly competition
    setTimeout(()=>{ showText('Balance requires precision. Too many wolves created a different kind of imbalance.','24px'); },arrivedEAt+12000);  // S7E — Narration: balance requires precision
    // 40% trees + patches fade out
    const pinesE=allTrees.filter(t=>t.type==='pine');
    setTimeout(()=>{
      pinesE.slice(0,Math.floor(pinesE.length*0.4)).forEach(({el})=>{ el.style.opacity='1'; });
      patchEls.forEach(img=>{ img.style.transition='opacity 2.0s ease'; img.style.opacity='0'; });
    },arrivedEAt+13000);                                                                               // S7E — 40% pine trees partially regrow + bare patches fade
    setTimeout(()=>{ s7Btn.classList.add('show'); },arrivedEAt+16000);                               // S7E — Continue button appears
  }

  // ── Screen 8 ──────────────────────────────────────────────────────────────────
  function buildScreen8() {
    // No scene wipe — UI layer drops on top of current S7 scene state
    // Remove old continue btn, s7-narration
    const oldNar = document.getElementById('s7-narration');
    if (oldNar) oldNar.remove();
    const oldBtn = document.querySelector('.continue-btn');
    if (oldBtn) oldBtn.remove();

    const w=window.innerWidth, h=Math.round(w*9/16);

    // Top narration box
    const narBox=document.createElement('div');
    narBox.className='top-dark-box';
    narBox.style.zIndex='1000';
    narBox.innerHTML='<p style="font-family:Georgia,serif;font-style:italic;font-size:22px;color:#fff;margin:0;">Now explore the system. Use the controls to see what happens.</p>';
    scene.appendChild(narBox);

    // Slider bar
    const sliderBar=document.createElement('div');
    sliderBar.id='s8-slider-bar';
    const wolfCount0=Math.min(window.wolvesChosen||7,14);
    sliderBar.innerHTML=`
      <div class="s8-slider-group">
        <label>Wolf population</label>
        <input type="range" id="s8-wolf-sl" min="0" max="28" value="${wolfCount0}">
        <span class="s8-val" id="s8-wolf-val">${wolfCount0}</span>
      </div>
      <div class="s8-slider-group">
        <label>Human hunting pressure</label>
        <input type="range" id="s8-hunt-sl" min="0" max="${wolfCount0}" value="0">
        <span class="s8-val" id="s8-hunt-val">0</span>
        <span class="s8-sub">Simulates poaching / rancher conflict</span>
      </div>
    `;
    scene.appendChild(sliderBar);

    // Dashboard
    const dash=document.createElement('div');
    dash.id='s8-dashboard';
    dash.style.right=ECOSYSTEM.dashboard.right;
    dash.style.top=ECOSYSTEM.dashboard.top;
    dash.style.width=ECOSYSTEM.dashboard.width;
    dash.innerHTML=`
      <div class="db-row"><span class="db-label">Wolf population</span><span class="db-val" id="db-wolf">${wolfCount0}</span><span class="db-arrow" id="db-wolf-arr"></span></div>
      <div class="db-row"><span class="db-label">Elk population</span><span class="db-val" id="db-elk">—</span><span class="db-arrow" id="db-elk-arr"></span></div>
      <div class="db-row"><span class="db-label">Vegetation</span><span class="db-val" id="db-veg">—</span><span class="db-arrow" id="db-veg-arr"></span></div>
      <div class="db-row"><span class="db-label">River health</span><span class="db-val" id="db-riv">—</span><span class="db-arrow" id="db-riv-arr"></span></div>
      <div class="db-row"><span class="db-label">Biodiversity</span><span class="db-val" id="db-bio">—</span><span class="db-arrow" id="db-bio-arr"></span></div>
    `;
    scene.appendChild(dash);

    // Clear existing animals and rebuild cleanly for sandbox
    scene.querySelectorAll('.animal').forEach(el=>el.remove());

    const sbElkEls=[]; const sbWolfEls=[]; const sbSpeciesEls={};

    ECOSYSTEM.elk.forEach((d,i)=>{
      const img=buildAnimal('images/elk.png',d,d.h||0.10,i,dash);
      img.style.opacity='1'; sbElkEls.push(img);
    });
    ECOSYSTEM.wolves.forEach((d,i)=>{
      const img=buildAnimal('images/wolf.png',d,d.h||0.085,100+i,dash);
      img.style.opacity=i<wolfCount0?'1':'0'; sbWolfEls.push(img);
    });
    const w8=window.innerWidth, h8=Math.round(w8*9/16);
    layoutAnimals(sbWolfEls, w8, h8);
    const sbCoyoteEls=[];
    coyoteDefs.forEach((d,i)=>{
      const img=buildAnimal('images/coyote.png',d,d.h||0.07,200+i,dash);
      img.style.transform='scaleX(-1)'; img.style.opacity='1';
      sbCoyoteEls.push(img);
    });
    layoutAnimals(sbCoyoteEls, w8, h8);

    // Bare soil patches — visible only when wolf population is 0
    const sbPatchEls = buildPatches(dash, false);
    layoutPatches(sbPatchEls, w8, h8);

    // Cascade species — show/hide based on wolf count
    const speciesKeys=['beaver','beaverDam','grizzly','songbird','otter','eagle','pronghorn'];
    const speciesSrc={ beaver:'images/beaver.png', beaverDam:'images/beaver-dam.png', grizzly:'images/grizzly.png',
      songbird:'images/songbird.png', otter:'images/otter.png', eagle:'images/eagle.png', pronghorn:'images/pronghorn.png' };
    speciesKeys.forEach(key=>{
      const def=ECOSYSTEM[key];
      const img=document.createElement('img');
      img.src=speciesSrc[key]; img.alt=''; img.classList.add('animal');
      img.onerror=()=>{img.style.display='none';};
      img.dataset.xPct=def.x; img.dataset.yPct=def.y; img.dataset.scale='1';
      img.dataset.baseHeightFactor=def.h;
      img.style.transition='opacity 0.2s ease'; img.style.opacity='0';
      img.style.animationName='bob'; img.style.animationDuration='2.5s';
      img.style.animationTimingFunction='ease-in-out'; img.style.animationIterationCount='infinite';
      scene.insertBefore(img,dash); sbSpeciesEls[key]=img;
    });

    // Muddy overlay
    let muddyOvSb=document.getElementById('muddy-ov');
    if (!muddyOvSb) {
      muddyOvSb=document.createElement('div');
      muddyOvSb.id='muddy-ov';
      muddyOvSb.style.cssText=`position:absolute;left:0;right:0;pointer-events:none;z-index:8;
        background:${ECOSYSTEM.muddyPatch.color};opacity:0;transition:opacity 0.5s ease;`;
      scene.insertBefore(muddyOvSb,narBox);
    }

    // Tooltip
    const tooltip=document.createElement('div');
    tooltip.className='eco-tooltip'; tooltip.style.display='none';
    scene.appendChild(tooltip);

    const tooltipTexts={
      wolf:'Apex predator. Controls elk movement and population.',
      elk:'Key prey species. Overgrazing damages vegetation when unchecked.',
      coyote:'Mid-level predator. Suppressed by wolves, otherwise dominates.',
      beaver:'Ecosystem engineer. Dams slow rivers and create wetland habitats.',
      beaverDam:'Beaver dam. Slows river flow and creates wetland habitats.',
      grizzly:'Opportunistic predator. Benefits from wolf kills as food source.',
      songbird:'Indicator species. Returns when riverside trees are restored.',
      otter:'Aquatic species. Thrives only in clean, slow-moving water.',
      eagle:'Top avian predator. Returns when rodent populations recover.',
      pronghorn:'Fast grazer. Recovers when coyote pressure is reduced by wolves.',
      tree:'Riparian vegetation. Stabilises riverbanks and supports biodiversity.',
    };

    function attachTooltip(el, key) {
      el.style.cursor='pointer';
      el.style.pointerEvents='auto';
      el.addEventListener('click',(e)=>{
        e.stopPropagation();
        tooltip.textContent=tooltipTexts[key]||'';
        tooltip.style.display='block';
        const rect=el.getBoundingClientRect();
        const sceneRect=scene.getBoundingClientRect();
        tooltip.style.left=`${rect.left-sceneRect.left+rect.width/2}px`;
        tooltip.style.top=`${rect.top-sceneRect.top-60}px`;
        tooltip.style.transform='translateX(-50%)';
      });
    }
    sbWolfEls.forEach(el=>attachTooltip(el,'wolf'));
    sbElkEls.forEach(el=>attachTooltip(el,'elk'));
    Object.entries(sbSpeciesEls).forEach(([key,el])=>attachTooltip(el,key));
    allTrees.forEach(({el})=>{
      el.style.cursor='pointer'; el.style.pointerEvents='auto';
      el.addEventListener('click',(e)=>{
        e.stopPropagation();
        tooltip.textContent=tooltipTexts.tree;
        tooltip.style.display='block';
        const rect=el.getBoundingClientRect();
        const sceneRect=scene.getBoundingClientRect();
        tooltip.style.left=`${rect.left-sceneRect.left+rect.width/2}px`;
        tooltip.style.top=`${rect.top-sceneRect.top-50}px`;
        tooltip.style.transform='translateX(-50%)';
      });
    });
    scene.addEventListener('click',()=>{ tooltip.style.display='none'; });

    // Layout sandbox
    function s8Layout() {
      const sw=window.innerWidth,sh=Math.round(sw*9/16);
      scene.style.height=`${sh}px`;
      layoutTrees(sw,sh);
      layoutAnimals([...sbElkEls,...sbWolfEls,...sbCoyoteEls],sw,sh);
      layoutPatches(sbPatchEls,sw,sh);
      muddyOvSb.style.top=ECOSYSTEM.muddyPatch.top;
      muddyOvSb.style.height=ECOSYSTEM.muddyPatch.height;
      speciesKeys.forEach(key=>{
        const def=ECOSYSTEM[key],el=sbSpeciesEls[key];
        el.style.height=`${Math.round(sh*def.h)}px`; el.style.width='auto';
        el.style.left=`${Math.round(sw*def.x/100)}px`;
        el.style.top=`${Math.round(sh*def.y/100)}px`;
        el.style.zIndex=String(def.z);
      });
    }
    activeLayout=s8Layout;
    window.addEventListener('resize',s8Layout);
    s8Layout();

    // State tracking for arrows
    let prevState={wolf:wolfCount0,elk:0,veg:0,riv:0,bio:0};
    let sliderMoved=false;

    function calcStats(wc) {
      const elkC=Math.max(4,Math.round(28-wc*1.4));
      const vegPct=wc>=14?100:wc>=7?60:wc>=1?25:0;
      const rivPct=wc>=14?100:wc>=7?65:wc>=1?30:5;
      const bioPct=wc>=14?100:wc>=7?60:wc>=1?25:0;
      return {wolf:wc,elk:elkC,veg:vegPct,riv:rivPct,bio:bioPct};
    }

    function arrow(curr,prev) {
      if (curr>prev) return '<span class="db-arrow db-up">↑</span>';
      if (curr<prev) return '<span class="db-arrow db-dn">↓</span>';
      return '';
    }

    function updateDash(stats) {
      const ids=['wolf','elk','veg','riv','bio'];
      const vals=[stats.wolf,stats.elk,`${stats.veg}%`,`${stats.riv}%`,`${stats.bio}%`];
      const prevVals=[prevState.wolf,prevState.elk,prevState.veg,prevState.riv,prevState.bio];
      ids.forEach((id,i)=>{
        const v=document.getElementById(`db-${id}`);
        const a=document.getElementById(`db-${id}-arr`);
        if(v)v.textContent=vals[i];
        if(a)a.innerHTML=arrow(typeof vals[i]==='string'?parseInt(vals[i]):vals[i],prevVals[i]);
      });
      prevState={...stats};
    }

    function applyWolfCount(wc) {
      sbWolfEls.forEach((img,i)=>{
        img.style.transition='opacity 0.2s ease';
        img.style.opacity=i<wc?'1':'0';
      });
      const stats=calcStats(wc);
      const elkVisible=stats.elk;
      sbElkEls.forEach((img,i)=>{
        img.style.transition='opacity 0.2s ease';
        img.style.opacity=i<elkVisible?'1':'0';
      });
      // Trees
      const pine=allTrees.filter(t=>t.type==='pine');
      const grass=allTrees.filter(t=>t.type==='grassland');
      const showPct=wc>=14?1:wc>=7?0.5:wc>=1?0.2:0;
      const showN=Math.round(pine.length*showPct);
      pine.forEach(({el},i)=>{ el.style.transition='opacity 0.2s ease'; el.style.opacity=i<showN?'1':'0'; });
      grass.forEach(({el})=>{ el.style.transition='opacity 0.2s ease'; el.style.opacity=wc>=1?'1':'0'; });
      // Muddy overlay
      muddyOvSb.style.transition='opacity 0.2s ease';
      muddyOvSb.style.opacity=wc>=7?'0':'1';
      // Bare soil patches — only visible when no wolves
      sbPatchEls.forEach(img=>{ img.style.transition='opacity 0.4s ease'; img.style.opacity=wc===0?'1':'0'; });
      // Species
      speciesKeys.forEach(key=>{
        const thr=key==='grizzly'?8:12;
        sbSpeciesEls[key].style.opacity=wc>=thr?'1':'0';
      });
      updateDash(stats);
    }

    // Wire sliders
    const wolfSl=document.getElementById('s8-wolf-sl');
    const huntSl=document.getElementById('s8-hunt-sl');
    const wolfValEl=document.getElementById('s8-wolf-val');
    const huntValEl=document.getElementById('s8-hunt-val');

    // Map button (always visible)
    const mapBtn=document.createElement('button');
    mapBtn.className='continue-btn'; mapBtn.textContent='→ See Interactive Map';
    mapBtn.style.bottom='70px'; mapBtn.style.top='auto'; mapBtn.style.right='24px';
    scene.appendChild(mapBtn);
    mapBtn.classList.add('show');
    mapBtn.addEventListener('click',()=>buildScreen9());

    wolfSl.addEventListener('input',()=>{
      if (!sliderMoved) { sliderMoved=true; }
      const wc=parseInt(wolfSl.value);
      wolfValEl.textContent=wc;
      huntSl.max=wc;
      if (parseInt(huntSl.value)>wc) { huntSl.value=wc; huntValEl.textContent=wc; }
      applyWolfCount(Math.max(0,wc-parseInt(huntSl.value)));
    });
    huntSl.addEventListener('input',()=>{
      if (!sliderMoved) { sliderMoved=true; }
      const killed=parseInt(huntSl.value);
      huntValEl.textContent=killed;
      const effectiveWolves=Math.max(0,parseInt(wolfSl.value)-killed);
      applyWolfCount(effectiveWolves);
      document.getElementById('db-wolf').textContent=effectiveWolves;
    });

    // Restart button
    const restartBtn=document.createElement('button');
    restartBtn.className='continue-btn'; restartBtn.textContent='↺ Restart';
    restartBtn.style.bottom='20px'; restartBtn.style.top='auto'; restartBtn.style.right='24px';
    scene.appendChild(restartBtn);
    restartBtn.classList.add('show');
    restartBtn.addEventListener('click',()=>{ location.reload(); });

    // Init display
    applyWolfCount(wolfCount0);
  }

  // ── Screen 9: Interactive Trophic Cascade Map ─────────────────────────────
  function buildScreen9() {
    const s9=document.createElement('div');
    s9.id='s9-screen';
    document.body.appendChild(s9);

    s9.innerHTML=`
      <div id="s9-title-bar">
        <h1>The Trophic Cascade</h1>
        <span>Click any node to explore connections · Use sliders to see ecosystem health</span>
      </div>
      <div id="s9-body">
        <div id="s9-map"><svg id="s9-map-svg"></svg></div>
        <div id="s9-panel">
          <div id="s9-pname">Click a node</div>
          <p id="s9-pdesc">Select any element in the diagram to learn about its role in the Yellowstone ecosystem.</p>
          <div id="s9-pconn"></div>
        </div>
      </div>
      <div id="s9-bottom">
        <div class="s9-sl-group">
          <label>Wolf population <span id="s9-wval">14</span></label>
          <input type="range" id="s9-wsl" min="0" max="14" value="14">
        </div>
        <div class="s9-sl-group">
          <label>Human hunting pressure <span id="s9-hval">0</span></label>
          <input type="range" id="s9-hsl" min="0" max="10" value="0">
          <div class="s9-sl-sub">Simulates poaching / rancher conflict</div>
        </div>
        <div id="s9-legend">
          <div class="s9-leg"><div class="s9-leg-line pos"></div>positive</div>
          <div class="s9-leg"><div class="s9-leg-line neg"></div>negative</div>
          <div class="s9-leg"><div class="s9-leg-line neu"></div>indirect</div>
        </div>
        <button id="s9-close-btn">↺ Restart</button>
      </div>
    `;

    document.getElementById('s9-close-btn').addEventListener('click',()=>location.reload());

    const nodes=[
      {id:'humans',       label:'Humans',                        cx: 4,  cy:46, fact:'Humans reintroduced 14 wolves to Yellowstone in January 1995 after a 70-year absence. One deliberate decision cascaded across the entire ecosystem.'},
      {id:'wolves',       label:'Wolves',                        cx:18,  cy:46, fact:'14 wolves arrived in 3 packs. Through direct predation and the "ecology of fear" they reshaped how elk moved, grazed, and behaved.'},
      {id:'elk',          label:'Elk',                           cx:32,  cy:37, fact:'Population fell from ~19,000 to ~6,100 after wolf reintroduction. Crucially, surviving elk became healthier and stopped grazing riverbanks where they could be ambushed.'},
      {id:'scavengers',   label:'Scavengers\n(ravens, eagles, bears)', cx:13, cy:63, fact:'Wolf-killed carcasses provided critical winter food for ravens, eagles, magpies, and bears — species that had struggled without this resource.'},
      {id:'coyotes',      label:'Coyotes',                       cx:21,  cy:74, fact:'Coyote numbers dropped ~33% as wolves suppressed them. This "mesopredator release" allowed populations of small mammals to recover across the valley.'},
      {id:'smallmammals', label:'Small mammals\n(mice, rabbits, voles)', cx:31, cy:83, fact:'With fewer coyotes hunting them, small mammal populations rebounded — restoring a key food source for raptors and other predators.'},
      {id:'hawks',        label:'Hawks / foxes\n/ weasels',      cx:46,  cy:83, fact:'Raptors, foxes, and weasels that depend on small mammals thrived as their prey base grew. Biodiversity in this guild increased measurably.'},
      {id:'trees',        label:'Trees &\nVegetation',           cx:52,  cy:46, fact:'Willows and aspens grew 5× taller within 6 years. Riverbank vegetation that had been grazed bare for decades recovered as elk avoided exposed areas.'},
      {id:'land',         label:'Land',                          cx:41,  cy:63, fact:'As vegetation returned, bare eroded ground stabilised. Runoff slowed, soil anchored, and the land began healing after decades of overgrazing.'},
      {id:'riverbanks',   label:'River banks',                   cx:63,  cy:28, fact:'Riverside willows and aspens stabilised the banks dramatically — their roots held soil that had been eroding for 70 years without wolves.'},
      {id:'biodiversity', label:'Biodiversity',                  cx:72,  cy:26, fact:'Overall biodiversity surged. Songbirds, otters, pronghorn, muskrats, and many other species returned or increased significantly within years of wolf reintroduction.'},
      {id:'beavers',      label:'Beavers',                       cx:68,  cy:46, fact:'From 1 colony in 1995 to 9 colonies by 2023. As ecosystem engineers, beaver dams create wetlands that support dozens of other species.'},
      {id:'dams',         label:'Dams',                          cx:67,  cy:61, fact:'Beaver dams raised the water table, created ponds, and slowed river flow — physically transforming the landscape in ways that benefit countless species.'},
      {id:'rivers',       label:'Rivers',                        cx:82,  cy:17, fact:'Rivers literally changed course. Stabilised banks and altered flow patterns physically reshaped Yellowstone\'s waterways — the wolves changed the geography of the land.'},
      {id:'wetlands',     label:'Wetlands',                      cx:80,  cy:61, fact:'New wetland habitats emerged from beaver activity and bank stabilisation, supporting fish, amphibians, invertebrates, and migratory birds.'},
      {id:'birds',        label:'Birds',                         cx:68,  cy:75, fact:'Songbird populations increased dramatically as riverside vegetation grew back, providing nesting sites and insect-rich feeding habitat.'},
      {id:'fish',         label:'Fish',                          cx:91,  cy:39, fact:'Trout and other fish populations rebounded as rivers ran cleaner, water temperatures improved, and stable banks reduced sediment in the water.'},
    ];

    const edges=[
      {id:'e1',  from:'humans',       to:'wolves',       label:'reintroduced',         type:'pos', curve:0   },
      {id:'e2',  from:'wolves',       to:'elk',          label:'prey on',              type:'neg', curve:18  },
      {id:'e3',  from:'wolves',       to:'elk',          label:'change movement of',   type:'neu', curve:-18 },
      {id:'e4',  from:'wolves',       to:'scavengers',   label:'leave carcasses for',  type:'pos', curve:0   },
      {id:'e5',  from:'wolves',       to:'coyotes',      label:'reduce',               type:'neg', curve:0   },
      {id:'e6',  from:'elk',          to:'trees',        label:'overgraze',            type:'neg', curve:0   },
      {id:'e7',  from:'coyotes',      to:'smallmammals', label:'prey on',              type:'neg', curve:0   },
      {id:'e8',  from:'smallmammals', to:'hawks',        label:'provide food for',     type:'pos', curve:0   },
      {id:'e9',  from:'trees',        to:'riverbanks',   label:'stabilize',            type:'pos', curve:0   },
      {id:'e10', from:'trees',        to:'rivers',       label:'grow near',            type:'pos', curve:-90 },
      {id:'e11', from:'trees',        to:'biodiversity', label:'increase',             type:'pos', curve:0   },
      {id:'e12', from:'trees',        to:'beavers',      label:'provides food for',    type:'pos', curve:0   },
      {id:'e13', from:'trees',        to:'birds',        label:'provides habitat for', type:'pos', curve:20  },
      {id:'e14', from:'trees',        to:'land',         label:'grow on',              type:'pos', curve:0   },
      {id:'e15', from:'riverbanks',   to:'rivers',       label:'shape',                type:'pos', curve:0   },
      {id:'e16', from:'beavers',      to:'dams',         label:'build',                type:'pos', curve:0   },
      {id:'e17', from:'dams',         to:'rivers',       label:'change course',        type:'neu', curve:-30 },
      {id:'e18', from:'rivers',       to:'fish',         label:'provide habitat for',  type:'pos', curve:0   },
      {id:'e19', from:'rivers',       to:'wetlands',     label:'slow',                 type:'pos', curve:0   },
      {id:'e20', from:'wetlands',     to:'birds',        label:'support',              type:'pos', curve:0   },
      {id:'e21', from:'wetlands',     to:'fish',         label:'support',              type:'pos', curve:30  },
    ];

    const nodeMap={};
    nodes.forEach(n=>nodeMap[n.id]=n);
    const nodeEls={};

    const mapDiv=document.getElementById('s9-map');
    nodes.forEach(n=>{
      const el=document.createElement('div');
      el.className='s9-node'; el.id='s9-n-'+n.id;
      el.textContent=n.label;
      el.style.left=n.cx+'%'; el.style.top=n.cy+'%';
      mapDiv.appendChild(el);
      nodeEls[n.id]=el;
    });

    const svg=document.getElementById('s9-map-svg');
    const edgePathEls={};

    function renderArrows(){
      const W=mapDiv.clientWidth, H=mapDiv.clientHeight;
      if(!W||!H) return;
      svg.setAttribute('width',W); svg.setAttribute('height',H);
      svg.innerHTML='';
      svg.innerHTML=`<defs>
        <marker id="ah-pos" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0.5 L0,5.5 L7,3 z" fill="#6ef06e"/></marker>
        <marker id="ah-neg" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0.5 L0,5.5 L7,3 z" fill="#f06e6e"/></marker>
        <marker id="ah-neu" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0.5 L0,5.5 L7,3 z" fill="rgba(255,255,255,0.45)"/></marker>
      </defs>`;
      const colors={pos:'#6ef06e',neg:'#f06e6e',neu:'rgba(255,255,255,0.35)'};
      const nodeR=26;

      edges.forEach(edge=>{
        const fn=nodeMap[edge.from], tn=nodeMap[edge.to];
        const x1=fn.cx/100*W, y1=fn.cy/100*H;
        const x2=tn.cx/100*W, y2=tn.cy/100*H;
        const dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy)||1;
        const nx=-dy/len, ny=dx/len;
        const cpx=(x1+x2)/2+nx*(edge.curve||0);
        const cpy=(y1+y2)/2+ny*(edge.curve||0);
        const sdx=cpx-x1, sdy=cpy-y1, sl=Math.sqrt(sdx*sdx+sdy*sdy)||1;
        const sx=x1+sdx/sl*nodeR, sy=y1+sdy/sl*nodeR;
        const edx=x2-cpx, edy=y2-cpy, el=Math.sqrt(edx*edx+edy*edy)||1;
        const ex=x2-edx/el*nodeR, ey=y2-edy/el*nodeR;
        const pathD=`M${sx.toFixed(1)},${sy.toFixed(1)} Q${cpx.toFixed(1)},${cpy.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}`;
        const color=colors[edge.type];

        const path=document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('d',pathD); path.setAttribute('fill','none');
        path.setAttribute('stroke',color); path.setAttribute('stroke-width','1.5');
        path.setAttribute('marker-end','url(#ah-'+edge.type+')');
        path.setAttribute('opacity','0.6'); path.setAttribute('data-edge',edge.id);
        svg.appendChild(path);

        const lx=(0.25*sx+0.5*cpx+0.25*ex).toFixed(1);
        const ly=(0.25*sy+0.5*cpy+0.25*ey-5).toFixed(1);
        const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
        txt.setAttribute('x',lx); txt.setAttribute('y',ly);
        txt.setAttribute('fill',color); txt.setAttribute('font-size','9.5');
        txt.setAttribute('font-family','Georgia,serif'); txt.setAttribute('text-anchor','middle');
        txt.setAttribute('opacity','0.7'); txt.setAttribute('data-edge',edge.id);
        txt.textContent=edge.label;
        svg.appendChild(txt);

        edgePathEls[edge.id]={path,txt};
      });
    }

    let activeNode=null;

    function resetHighlight(){
      Object.values(nodeEls).forEach(el=>el.classList.remove('s9-active','s9-connected','s9-dimmed'));
      document.querySelectorAll('[data-edge]').forEach(el=>{
        el.setAttribute('opacity', el.tagName==='path'?'0.6':'0.7');
        if(el.tagName==='path') el.setAttribute('stroke-width','1.5');
      });
    }

    function setActive(nodeId){
      if(activeNode===nodeId){ activeNode=null; resetHighlight();
        document.getElementById('s9-pname').textContent='Click a node';
        document.getElementById('s9-pdesc').textContent='Select any element in the diagram to learn about its role in the Yellowstone ecosystem.';
        document.getElementById('s9-pconn').textContent=''; return;
      }
      activeNode=nodeId;
      const connected=new Set(), connEdges=new Set();
      edges.forEach(e=>{
        if(e.from===nodeId||e.to===nodeId){ connected.add(e.from); connected.add(e.to); connEdges.add(e.id); }
      });
      connected.delete(nodeId);
      Object.entries(nodeEls).forEach(([id,el])=>{
        el.classList.remove('s9-active','s9-connected','s9-dimmed');
        if(id===nodeId) el.classList.add('s9-active');
        else if(connected.has(id)) el.classList.add('s9-connected');
        else el.classList.add('s9-dimmed');
      });
      document.querySelectorAll('[data-edge]').forEach(el=>{
        const eid=el.getAttribute('data-edge');
        if(connEdges.has(eid)){
          el.setAttribute('opacity','0.95');
          if(el.tagName==='path') el.setAttribute('stroke-width','2.5');
        } else {
          el.setAttribute('opacity','0.04');
        }
      });
      const n=nodeMap[nodeId];
      document.getElementById('s9-pname').textContent=n.label.replace(/\n/g,' ');
      document.getElementById('s9-pdesc').textContent=n.fact;
      const out=edges.filter(e=>e.from===nodeId).map(e=>`→ ${nodeMap[e.to].label.replace(/\n/g,' ')} (${e.label})`);
      const inc=edges.filter(e=>e.to===nodeId).map(e=>`← ${nodeMap[e.from].label.replace(/\n/g,' ')} (${e.label})`);
      document.getElementById('s9-pconn').textContent=[...inc,...out].join('\n');
    }

    nodes.forEach(n=>{
      nodeEls[n.id].addEventListener('click',ev=>{ ev.stopPropagation(); setActive(n.id); });
    });
    mapDiv.addEventListener('click',()=>{ if(activeNode) setActive(activeNode); });

    function updateHealth(){
      const w=parseInt(document.getElementById('s9-wsl').value);
      const h=parseInt(document.getElementById('s9-hsl').value);
      const ew=Math.max(0,w-h*0.9);
      const states={
        humans:'neu',
        wolves:       ew>=8?'healthy':ew>=4?'neu':'stressed',
        elk:          ew>=8?'stressed':ew>=4?'neu':'healthy',
        scavengers:   ew>=6?'healthy':ew>=3?'neu':'stressed',
        coyotes:      ew>=6?'stressed':ew>=3?'neu':'healthy',
        smallmammals: ew>=6?'healthy':ew>=3?'neu':'stressed',
        hawks:        ew>=6?'healthy':ew>=3?'neu':'stressed',
        trees:        ew>=8?'healthy':ew>=4?'neu':'stressed',
        land:         ew>=8?'healthy':ew>=4?'neu':'stressed',
        riverbanks:   ew>=8?'healthy':ew>=4?'neu':'stressed',
        biodiversity: ew>=9?'healthy':ew>=4?'neu':'stressed',
        beavers:      ew>=8?'healthy':ew>=4?'neu':'stressed',
        dams:         ew>=8?'healthy':ew>=4?'neu':'stressed',
        rivers:       ew>=8?'healthy':ew>=4?'neu':'stressed',
        wetlands:     ew>=8?'healthy':ew>=4?'neu':'stressed',
        birds:        ew>=9?'healthy':ew>=4?'neu':'stressed',
        fish:         ew>=8?'healthy':ew>=4?'neu':'stressed',
      };
      Object.entries(states).forEach(([id,state])=>{
        const el=nodeEls[id];
        el.classList.remove('s9-healthy','s9-stressed');
        if(state==='healthy') el.classList.add('s9-healthy');
        else if(state==='stressed') el.classList.add('s9-stressed');
      });
    }

    document.getElementById('s9-wsl').addEventListener('input',function(){
      document.getElementById('s9-wval').textContent=this.value; updateHealth();
    });
    document.getElementById('s9-hsl').addEventListener('input',function(){
      document.getElementById('s9-hval').textContent=this.value; updateHealth();
    });

    setTimeout(()=>{ renderArrows(); updateHealth(); },50);
    window.addEventListener('resize',()=>setTimeout(renderArrows,50));
  }


</script>
